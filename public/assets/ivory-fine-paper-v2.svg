<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Periodic noise keeps opposite tile edges continuous. -->
  <filter id="paper-relief" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".26 .38" numOctaves="3" seed="23" stitchTiles="stitch" result="grain"/>
    <feDiffuseLighting in="grain" surfaceScale="1.1" diffuseConstant="1" lighting-color="#fff" result="relief">
      <feDistantLight azimuth="225" elevation="62"/>
    </feDiffuseLighting>
    <feComponentTransfer in="relief">
      <feFuncA type="linear" slope=".10"/>
    </feComponentTransfer>
  </filter>
  <filter id="fine-fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".64 .48" numOctaves="2" seed="19" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0" intercept=".40"/>
      <feFuncG type="linear" slope="0" intercept=".40"/>
      <feFuncB type="linear" slope="0" intercept=".40"/>
      <feFuncA type="linear" slope=".025"/>
    </feComponentTransfer>
  </filter>
  <path filter="url(#paper-relief)" d="M0 0h512v512H0z"/>
  <path filter="url(#fine-fibers)" d="M0 0h512v512H0z"/>
</svg>
